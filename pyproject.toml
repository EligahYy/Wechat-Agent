[project]
name = "wechat-agent"
version = "0.12.1"
description = "Local EU stocking customer follow-up assistant"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "certifi>=2024.8.30,<2027", "jinja2>=3.1,<4", "pydantic>=2.9,<3", "keyring>=25,<26"]

[project.scripts]
wechat-agent = "wechat_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
