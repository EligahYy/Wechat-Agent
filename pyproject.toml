[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-agent"
version = "0.1.0"
description = "Local customer data workspace and capability diagnostics"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2,<3", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jsonschema>=4,<5", "keyring>=25,<26"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pip-tools>=7,<8", "httpx2>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wechat_agent.storage" = ["migrations/*.sql"]
"wechat_agent.model" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
