  position: relative;
  white-space: nowrap;
}
.detail-tabs button[aria-selected="true"] {
  color: var(--action);
  font-weight: 500;
}
.detail-tabs button[aria-selected="true"]:after {
  content: "";
  height: 2px;
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  background: var(--action);
}
.overview-intro {
  padding: 20px 22px;
  background: var(--action-wash);
  border-radius: 14px;
  margin-bottom: 26px;
}
.overview-intro .eyebrow {
  color: var(--action);
  font-size: 11px;
  letter-spacing: 0.03em;
}
.overview-intro h3 {
  margin-top: 9px;
  font-size: 19px;
  line-height: 1.55;
}
.overview-intro p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 9px;
}
.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 25px 0 14px;
}
.section-title h3 {
  font-size: 16px;
}
.section-title > span {
  font-size: 11px;
  color: var(--muted);
}
.facts-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.fact {
  padding: 16px;
  background: var(--surface-alt);
  border: 1px solid var(--line);
  border-radius: 10px;
  min-width: 0;
}
.fact .label {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 5px;
}
.fact p {
  font-size: 13px;
  line-height: 1.65;
}
.fact-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
  color: var(--muted);
  font-size: 10px;
}
.fact-footer button {
  border: 0;
  background: transparent;
  color: var(--action);
  padding: 4px 0;
  min-height: 28px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.fact-footer svg {
  width: 13px;
  height: 13px;
}
.fact.span-two {
  grid-column: span 2;
}
.gap-note {
  padding: 15px 17px;
  border: 1px dashed var(--line-strong);
  border-radius: 10px;
  display: flex;
  gap: 10px;
  margin-top: 15px;
  color: var(--muted);
  font-size: 12px;
  align-items: flex-start;
}
.gap-note svg {
  width: 16px;
  height: 16px;
  margin-top: 3px;
}
.gap-note strong {
  color: var(--ink);
  font-size: 12px;
  display: block;
  font-weight: 500;
  margin-bottom: 3px;
}
.shipment {
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 14px;
  margin-bottom: 14px;
}
.shipment-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.shipment-head h3 {
  font-size: 15px;
}
.shipment-time {
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
}
.shipment-fields {
  display: grid;
  gap: 10px;
  font-size: 12px;
}
.shipment-fields > div {
  display: grid;
  grid-template-columns: 65px 1fr;
  gap: 15px;
}
.shipment-fields dt {
  color: var(--muted);
}
.shipment-fields dd {
  margin: 0;
  overflow-wrap: anywhere;
}
.number-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 2px 7px;
  margin: 0 4px 4px 0;
  font-variant-numeric: tabular-nums;
  font-size: 11px;
}
.shipment-actions {
  display: flex;
  align-items: center;
  gap: 20px;
  border-top: 1px solid var(--line);
  padding-top: 7px;
  margin-top: 15px;
}
.shipment-actions .text-button {
  min-height: 36px;
  font-size: 12px;
}
.section-lead {
  font-size: 12px;
  color: var(--muted);
  margin: 0 0 18px;
}
.history-note {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 12px;
  margin-top: 18px;
}
.history-note svg {
  width: 15px;
  height: 15px;
}
.timeline-group {
  font-size: 11px;
  color: var(--muted);
  margin: 22px 0 13px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.timeline-group:after {
  content: "";
  height: 1px;
  background: var(--line);
  flex: 1;
}
.message {
  border-left: 2px solid var(--line);
  padding: 0 0 0 14px;
  margin-bottom: 20px;
}
.message.own {
  border-left-color: var(--action);
}
.message-meta {
  font-size: 11px;
  color: var(--muted);
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 7px;
}
.message-meta strong {
  font-weight: 500;
  color: var(--ink);
}
.message p {
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-line;
}
.message-location {
  font-size: 10px;
  color: var(--muted);
  margin-top: 7px;
}
.attachment {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-top: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  background: var(--surface-alt);
  border-radius: 8px;
  width: 100%;
  text-align: left;
  min-height: 60px;
}
.attachment > svg {
  color: var(--action);
  width: 23px;
  height: 23px;
}
.attachment strong {
  font-size: 12px;
  font-weight: 500;
  display: block;
}
.attachment small {
  font-size: 10px;
  color: var(--muted);
}
.attachment .chev {
  margin-left: auto;
  width: 15px;
  color: var(--muted);
}
.timeline-search {
  max-width: none;
  margin-bottom: 14px;
}
.coverage-info {
  background: var(--surface-alt);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: 11px;
  color: var(--muted);
  margin-top: 22px;
}
.coverage-info strong {
  color: var(--ink);
  font-weight: 500;
  display: block;
  margin-bottom: 4px;
}
.overlay-dialog {
  width: min(560px, calc(100vw - 40px));
  border-radius: 20px;
}
.overlay-header {
  padding: 21px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}
.overlay-header h2 {
  font-size: 19px;
}
.overlay-header .icon-button {
  margin: -7px -10px -7px 0;
}
.overlay-body {
  padding: 24px;
}
.overlay-lead {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 20px;
}
.overlay-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  align-items: center;
}
.overlay-body .message:last-child {
  margin-bottom: 0;
}
.form-field {
  display: grid;
  gap: 8px;
  margin: 0 0 18px;
}
.form-field > span,
.form-field > label {
  font-size: 13px;
  font-weight: 500;
}

.form-field small {
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
}
.field-error {
  font-size: 12px;
  color: #ba2835;
  min-height: 20px;
}
.role-options {
  border: 0;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 10px;
}
.role-options legend {
  font-size: 13px;
  margin-bottom: 10px;
  font-weight: 500;
}
.role-option {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 15px;
  cursor: pointer;
}
.role-option:has(input:checked) {
  background: var(--action-wash);
  border-color: var(--action);
}
.role-option input {
  width: 17px;
  height: 17px;
  margin: 0;
}
.role-option strong {
  font-size: 14px;
  font-weight: 500;
  display: block;
}
.role-option span {
  font-size: 11px;
  color: var(--muted);
}
.role-option.unresolved {
  border-style: dashed;
  margin-top: 5px;
}
.privacy-note {
  font-size: 11px;
  color: var(--muted);
  margin-top: 18px;
}
.toast {
  position: fixed;
  bottom: 26px;
  left: calc(50% + 110px);
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--surface);
  font-size: 13px;
  max-width: calc(100vw - 40px);
  padding: 13px 22px;
  border-radius: 999px;
  z-index: 60;
  animation: toast-in 180ms var(--ease);
  text-align: center;
}
@keyframes toast-in {
  from {
    opacity: 0;
    translate: 0 6px;
  }
  to {
    opacity: 1;
    translate: 0 0;
  }
}
.preview-image {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
}
.file-table {
  border-collapse: collapse;
  width: 100%;
  font-size: 12px;
}
.file-table td,
.file-table th {
  padding: 12px;
  text-align: left;
  border: 1px solid var(--line);
}
.file-table th {
  font-weight: 500;
  background: var(--bg);
}
.settings-grid {
  max-width: 1040px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}
.settings-card {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  overflow: hidden;
}
.settings-card-head {
  padding: 23px 26px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 13px;
}
.settings-card-head > svg {
  color: var(--muted);
  width: 21px;
  height: 21px;
}
.settings-card h2 {
  font-size: 18px;
}
.settings-card-head p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 5px;
}
.settings-body {
  padding: 4px 26px;
}
.setting-row {
  display: flex;
  justify-content: space-between;
  gap: 28px;
  align-items: center;
  padding: 22px 0;
  border-bottom: 1px solid var(--line);
}
.setting-row:last-child {
  border-bottom: 0;
}
.setting-row strong {
  font-size: 14px;
  font-weight: 500;
  display: block;
}
.setting-row p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 5px;
  max-width: 560px;
}
.setting-row .btn {
  font-size: 12px;
  flex-shrink: 0;
}
.switch {
  border: 0;
  background: var(--line-strong);
  padding: 3px;
  width: 48px;
  height: 28px;
  border-radius: 999px;
  display: block;
  position: relative;
  flex-shrink: 0;
  min-width: 48px;
}
.switch:before {
  content: "";
  background: #fff;
  width: 22px;
  height: 22px;
  display: block;
  border-radius: 50%;
  transform: translateX(0);
  transition: transform 180ms var(--ease);
}
.switch[aria-checked="true"] {
  background: var(--action);
}
.switch[aria-checked="true"]:before {
  transform: translateX(20px);
}
.switch-hit {
  padding: 8px 0 8px 12px;
  min-height: 44px;
  display: flex;
  align-items: center;
}

.setting-values {
  display: flex;
  align-items: center;
  gap: 9px;
}
.time-zone {
  font-size: 11px;
  color: var(--muted);
}
.segmented {
  display: inline-flex;
  border-radius: 999px;
  padding: 4px;
  background: var(--bg);
  gap: 3px;
  flex-shrink: 0;
}
.segmented button {
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  min-height: 38px;
  padding: 7px 16px;
  font-size: 12px;
}
.segmented button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
}
.settings-note {
  font-size: 12px;
  color: var(--muted);
  padding: 16px 26px;
  background: var(--surface-alt);
  border-top: 1px solid var(--line);
}
.settings-note strong {
  font-weight: 500;
  color: var(--ink);
}
.progress-heading {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  margin-bottom: 13px;
}
.progress-heading strong {
  font-size: 14px;
  font-weight: 500;
}
.progress-heading span {
  font-size: 12px;
  color: var(--muted);
}
.progress-track {
  height: 5px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 12px;
}
.progress-track > span {
  height: 100%;
  display: block;
  background: var(--action);
  transition: width 200ms var(--ease);
  border-radius: 999px;
}
.progress-note {
  font-size: 12px;
  color: var(--muted);
}
.queue-list {
  padding: 0;
  margin: 24px 0 0;
  list-style: none;
}
.queue-list li {
  display: flex;
  align-items: center;
  gap: 12px;
  border-top: 1px solid var(--line);
  padding: 16px 0;
}
.queue-list .queue-status {
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
}
.queue-list strong {
  font-size: 13px;
  font-weight: 500;
}
.queue-list p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
}
.queue-status.running {
  color: var(--action) !important;
}
.queue-status.done {
  color: var(--positive) !important;
}
.run-explanation {
  font-size: 11px;
  color: var(--muted);
  background: var(--surface-alt);
  padding: 12px 14px;
  border-radius: 8px;
  margin-top: 10px;
}
@media (min-width: 1800px) {
  main {
    padding-left: 72px;
    padding-right: 72px;
  }
  .page-head {
    margin-top: 50px;
  }
  .merchant-table td {
    padding-top: 27px;
    padding-bottom: 27px;
  }
}
@media (max-width: 1200px) {
  .sidebar {
    width: 196px;
    padding-left: 16px;
    padding-right: 16px;
  }
  .brand {
    font-size: 14px;
    gap: 9px;
  }
  .brand-note {
    font-size: 10px;
  }
  main {
    margin-left: 196px;
    padding-left: 28px;
    padding-right: 28px;
  }
  .toast {
    left: calc(50% + 98px);
  }
  .merchant-table th:first-child {
    width: 24%;
  }
  .merchant-table th:nth-child(2) {
    width: 26%;
  }
  .merchant-table th:nth-child(3) {
    width: 34%;
  }
  .merchant-table th:nth-child(4) {
    width: 11%;
  }
  .merchant-table th,
  .merchant-table td {
    padding-left: 14px;
    padding-right: 14px;
  }
  .merchant-table td:first-child,
  .merchant-table th:first-child {
    padding-left: 20px;
  }
  .merchant-table td.update-cell {
    font-size: 10px;
  }
  .person-cell {
    gap: 9px;
  }
  .avatar {
    width: 30px;
    height: 30px;
    font-size: 11px;
  }
  .contacts-table th:first-child {
    width: 48px;
    padding: 5px;
  }
  .contacts-table td:first-child {
    padding: 10px 2px;
  }
  .contacts-table th:nth-child(2) {
    width: 28%;
  }
  .contacts-table th:nth-child(3) {
    width: 17%;
  }
  .contacts-table th:nth-child(4) {
    width: auto;
  }
  .contacts-table th:last-child {
    width: 16%;
  }
  .page-head {
    gap: 15px;
  }
  .head-actions {
    gap: 6px;
  }
  .head-actions .btn {
    padding-left: 14px;
    padding-right: 14px;
    font-size: 12px;
  }
  .detail-dialog {
    width: calc(100vw - 48px);
  }
  .detail-layout {
    grid-template-columns: 192px minmax(0, 1fr);
  }
  .detail-content {
    padding-left: 22px;
    padding-right: 22px;
  }
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.tab-count {
  color: var(--ink);
}
.search-field {
  display: block;
}
.search-caption {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 7px;
}
.search-field > svg {
  bottom: 14px;
}
.list-toolbar {
  align-items: flex-end;
}
.text-button {
  white-space: nowrap;
}
.person-name {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  min-width: 44px;
}
.btn--primary {
  --bg: var(--action-hover);
}
.btn:disabled {
  pointer-events: none;
}
.person-meta {
  margin-top: 0;
}
.fact-footer button {
  min-height: 44px;
  min-width: 44px;
  justify-content: center;
}
.mobile-identity {
  display: none;
}
.brand {
  min-height: 44px;
}
.run-strip .text-button {
  min-height: 44px;
}
.filter-button,
.segmented button {
  min-height: 44px;
}
.switch::after {
  content: "";
  position: absolute;
  inset: -8px 0;
  border-radius: 999px;
}

.detail-header {
  position: sticky;
  top: 0;
  z-index: 3;
  background: var(--surface);
}
:root[data-theme="dark"] .btn--primary {
  color: #071c30;
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
  dialog[open] {
    transform: none !important;
  }
}

/* Desktop refinement: glass for controls, opaque surfaces for customer information. */
:root {
  --glass: rgba(255, 255, 255, 0.76);
  --glass-line: rgba(255, 255, 255, 0.92);
  --glass-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 8px 28px rgba(30, 50, 80, 0.07);
  --glass-panel: rgba(249, 251, 255, 0.88);
}
:root[data-theme="dark"] {
  --glass: rgba(45, 47, 54, 0.78);
  --glass-line: rgba(255, 255, 255, 0.12);
  --glass-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.09), 0 8px 30px rgba(0, 0, 0, 0.25);
  --glass-panel: rgba(35, 37, 43, 0.9);
}
body {
  min-width: 1120px;
}
.sidebar {
  background: var(--glass-panel);
  backdrop-filter: blur(28px) saturate(150%);
  -webkit-backdrop-filter: blur(28px) saturate(150%);
  border-right-color: var(--line);
}
.brand-note,
.page-footer {
  display: none;
}
.brand {
  margin-bottom: 44px;
}
.sidebar nav a {
  transition:
    background-color 180ms var(--ease),
    color 180ms var(--ease);
}
.sidebar nav a[aria-current="page"] {
  background: var(--glass);
  border: 1px solid var(--glass-line);
  box-shadow: var(--glass-shadow);
}
.page-head {
  margin-bottom: 28px;
}
.detail-dialog {
  width: min(1120px, calc(100vw - 80px));
  max-width: 1120px;
  border-radius: 26px;
  box-shadow: 0 28px 100px rgba(0, 0, 0, 0.18);
  border: 1px solid var(--glass-line);
}
.detail-header,
.overlay-header {
  background: var(--glass);
  backdrop-filter: blur(26px) saturate(160%);
  -webkit-backdrop-filter: blur(26px) saturate(160%);
}
.detail-header {
  padding: 24px 28px 22px;
}
.detail-layout {
  grid-template-columns: 196px minmax(0, 1fr);
}
.detail-rail {
  background: var(--surface-alt);
  padding: 26px 22px;
}
.detail-content {
  padding: 0 28px 28px;
}
.detail-tabs {
  position: relative;
  isolation: isolate;
  display: inline-flex;
  gap: 4px;
  border: 1px solid var(--glass-line);
  border-radius: 999px;
  background: var(--bg);
  padding: 4px;
  margin: 22px 0 24px;
}
.detail-tabs button {
  font-size: 13px;
  position: relative;
  z-index: 1;
  min-height: 40px;
  padding: 8px 19px;
  border-radius: 999px;
  background: transparent;
}
.detail-tabs button[aria-selected="true"] {
  color: var(--ink);
  font-weight: 500;
}
.detail-tabs button[aria-selected="true"]::after {
  display: none;
}
.tab-glass {
  position: absolute;
  top: 4px;
  bottom: 4px;
  border-radius: 999px;
  background: var(--glass);
  backdrop-filter: blur(14px);
  border: 1px solid var(--glass-line);
  box-shadow: var(--glass-shadow);
  z-index: 0;
  transform-origin: left center;
  pointer-events: none;
}
.overview-intro {
  background: none;
  border-radius: 0;
  padding: 0 0 24px;
  border-bottom: 1px solid var(--line);
  margin: 0 0 24px;
}
.overview-intro .eyebrow {
  display: inline-flex;

.overview-intro h3 {
  font-size: 20px;
  line-height: 1.55;
  margin-top: 11px;
  letter-spacing: -0.025em;
}
.dossier-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 23px 24px 0;
  margin: 0 0 18px;
}
.dossier-card > header {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 13px;
}
.dossier-card h3 {
  font-size: 13px;
  letter-spacing: 0.01em;

}
.dossier-symbol {
  display: grid;
  place-items: center;

}
.dossier-symbol svg {

  height: 17px;
}
.dossier-headline {

  font-weight: 600;
  line-height: 1.5;
  letter-spacing: -0.02em;

}
.dossier-rows {
  margin: 0;

  gap: 11px;
}
.dossier-row {
  display: grid;
  grid-template-columns: 70px minmax(0, 1fr);
  gap: 17px;
  font-size: 13px;
  line-height: 1.7;
}
.dossier-row dt {
  color: var(--muted);
  font-size: 12px;
  padding-top: 1px;
}
.dossier-row dd {
  margin: 0;
  overflow-wrap: anywhere;
}
.dossier-row.missing-row {
  border-top: 1px solid var(--line);
  padding-top: 14px;
  margin-top: 5px;
}
.dossier-row.missing-row dt {
  color: var(--warning);
}
.dossier-row.missing-row dd {
  color: var(--muted);
  font-size: 12px;
}
.dossier-actions {
  display: flex;
  align-items: center;
  gap: 23px;
  border-top: 1px solid var(--line);
  margin-top: 20px;
  min-height: 59px;
}
.dossier-actions .text-button {
  font-size: 12px;
  gap: 6px;
}
.manual-mark {
  margin-left: auto;
  color: var(--muted);
  font-size: 11px;
}
.compact-history {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  gap: 14px;
  padding: 0 3px;
}
.compact-history time {
  margin-left: 12px;
}
.compact-history .text-button {
  font-size: 12px;
}
.evidence-group {
  border-bottom: 1px solid var(--line);
}
.evidence-group:last-child {
  border-bottom: 0;
}
.evidence-group summary {
  list-style: none;
  cursor: pointer;
  display: grid;
  grid-template-columns: 85px minmax(0, 1fr) 18px;
  gap: 12px;
  align-items: start;
  padding: 17px 0;
  font-size: 12px;
  color: var(--muted);
}
.evidence-group summary::-webkit-details-marker {
  display: none;
}
.evidence-group summary strong {
  font-weight: 500;
  color: var(--ink);
  line-height: 1.65;
}
.evidence-group summary svg {
  width: 15px;
  height: 15px;
  margin-top: 4px;
  transition: transform 220ms var(--ease);
}
.evidence-group[open] summary svg {
  transform: rotate(90deg);
}
.evidence-content {
  padding: 8px 0 8px 18px;
  animation: source-reveal 220ms var(--ease);
}
@keyframes source-reveal {
  from {
    opacity: 0;
    transform: translateY(-5px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.section-editor {
  display: grid;
  gap: 0;
}

.search-clear {
  position: absolute;
  right: 4px;
  bottom: 0;
  width: 40px;
  height: 44px;
  border: 0;
  background: transparent;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--muted);
}
.search-clear svg {
  width: 14px;
  height: 14px;
  padding: 2px;
  background: var(--line);
  border-radius: 50%;
  box-sizing: content-box;
}
.search-clear:hover {
  color: var(--ink);
}
.search-field > svg,
.search-clear {
  z-index: 1;
}
.filter-select {
  min-width: 170px;
}
.glass-select {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  background: var(--glass);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: inset 0 1px 0 var(--glass-line);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 38px;
  font-size: 13px;
  transition:
    box-shadow 180ms var(--ease),
    border-color 180ms var(--ease);
}
.glass-select svg {
  width: 14px;
  height: 14px;
  transform: rotate(90deg);
  color: var(--muted);
  transition: transform 220ms var(--ease);
}
.glass-select[aria-expanded="true"] svg {
  transform: rotate(-90deg);
}
.glass-select:hover {
  border-color: var(--muted);
}
.glass-select:focus-visible,
.glass-select[aria-expanded="true"] {
  border-color: var(--action);
  outline: none;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--action) 12%, transparent);
}
#filter-menu {
  position: fixed;
  inset: auto;
  margin: 0;
  width: 220px;
  padding: 6px;
  border: 1px solid var(--glass-line);
  border-radius: 17px;
  background: var(--glass-panel);
  color: var(--ink);
  backdrop-filter: blur(32px) saturate(160%);
  -webkit-backdrop-filter: blur(32px) saturate(160%);
  box-shadow:
    var(--glass-shadow),
    0 14px 44px rgba(20, 30, 55, 0.12);
  overflow: visible;
}
#filter-menu:popover-open {
  animation: menu-open 200ms cubic-bezier(0.22, 1, 0.36, 1);
}
#filter-menu {
  opacity: 0;
  transform: translateY(-5px) scale(0.97);
  transition:
    opacity 160ms var(--ease),
    transform 160ms var(--ease),
    display 160ms allow-discrete,
    overlay 160ms allow-discrete;
}
#filter-menu:popover-open {
  opacity: 1;
  transform: none;
}
@starting-style {
  #filter-menu:popover-open {
    opacity: 0;
    transform: translateY(-5px) scale(0.97);
  }
}
@keyframes menu-open {
  from {
    opacity: 0;
    transform: translateY(-5px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
#filter-menu button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 44px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  padding: 10px 13px;
  font-size: 13px;
  color: var(--ink);
}
#filter-menu button[aria-selected="true"] {
  background: var(--action-wash);
  color: var(--action);
}
#filter-menu button:hover,
#filter-menu button:focus-visible {
  background: var(--action-wash);
  outline: none;
}
#filter-menu svg {
  width: 15px;
  height: 15px;
}
dialog[open] {
  animation: glass-open 340ms cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes glass-open {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.975);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
dialog::backdrop {
  background: rgba(25, 30, 40, 0.26);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.overlay-dialog {
  border-radius: 22px;
  box-shadow: 0 24px 85px rgba(0, 0, 0, 0.15);
  border: 1px solid var(--glass-line);
}
.overlay-header {
  position: sticky;
  top: 0;
  z-index: 2;
}
.overlay-footer {
  position: sticky;
  bottom: 0;
  background: var(--glass-panel);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
@media (prefers-reduced-transparency: reduce) {
  .sidebar,
  .detail-header,
  .overlay-header,
  .overlay-footer,
  .tab-glass,
  .glass-select,
  #filter-menu {
    background: var(--surface);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/* Shared interactive states. Theme backgrounds are explicit for embedded previews too. */
html,
body,
main {
  background-color: var(--bg);
  color: var(--ink);
}
body,
main,
.list-surface,
.settings-card,
.detail-dialog,
.detail-rail,
.dossier-card,
.overlay-dialog {
  transition:
    background-color 220ms var(--ease),
    color 180ms var(--ease),
    border-color 180ms var(--ease);
}
button:not(.btn) {
  transition:
    background-color 160ms var(--ease),
    color 160ms var(--ease),
    border-color 160ms var(--ease),
    box-shadow 180ms var(--ease),
    transform 100ms var(--ease);
}
@media (hover: hover) and (pointer: fine) {
  button:not(.btn):not(:disabled):hover {
    filter: brightness(0.98);
  }
  .text-button:hover {
    color: var(--action-hover);
  }
  .icon-button:hover {
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .role-edit:hover,
  .person-name:hover {
    color: var(--action);
  }
}
button:not(.btn):not(:disabled):active {
  transform: scale(0.97);
}
button:disabled {
  opacity: 0.4;

  box-shadow: none;
}

.workspace-tabs {

.pending-update {

.theme-quick {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0;
  width: 74px;
  min-height: 38px;
  height: 38px;
  padding: 4px 7px;

  border: 1px solid var(--line);

.theme-quick > [data-icon] {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 26px;
  height: 28px;

  transition:
    color 220ms var(--ease),
    transform 320ms var(--ease);
}
.theme-quick svg {
  width: 16px;
  height: 16px;
}
.theme-thumb {
  position: absolute;
  left: 4px;
  top: 4px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--glass);
  border: 1px solid var(--glass-line);
  box-shadow: var(--glass-shadow);
  transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
}
.theme-quick[aria-pressed="true"] .theme-thumb {
  transform: translateX(36px);
}
.theme-quick[aria-pressed="false"] > [data-icon="sun"],
.theme-quick[aria-pressed="true"] > [data-icon="theme"] {
  color: var(--ink);
}
.theme-quick[aria-pressed="true"] > [data-icon="sun"] {
  transform: rotate(45deg) scale(0.88);
}
.theme-quick[aria-pressed="false"] > [data-icon="theme"] {
  transform: rotate(-18deg) scale(0.88);
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }

/* Compact desktop editor: short values are inputs, descriptions expand to their content. */
#overlay-dialog[data-kind="editor"] {
  width: min(740px, calc(100vw - 80px));
  max-height: calc(100dvh - 72px);
  overflow: hidden;
}
#overlay-dialog[data-kind="editor"][open] {
  display: flex;
  flex-direction: column;
}
#overlay-dialog[data-kind="editor"] .overlay-header,
#overlay-dialog[data-kind="editor"] .overlay-footer {
  flex-shrink: 0;
  position: static;
}
#overlay-dialog[data-kind="editor"] .overlay-header {
  padding: 23px 28px;
}
#overlay-dialog[data-kind="editor"] .overlay-body {
  min-height: 0;
  overflow-y: auto;
  padding: 25px 28px 26px;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
  scrollbar-width: thin;

  padding: 17px 28px;

.section-editor {

.editor-group {
  min-width: 0;

}
.editor-group:last-of-type {
  margin-bottom: 0;
}
.editor-group legend {
  padding: 0 0 13px;

.editor-group + .editor-group {

.editor-grid {

}
.section-editor .editor-field {
  min-width: 0;
  margin: 0;

.editor-field-wide {
  grid-column: 1 / -1;

.section-editor .editor-field > span {
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);

}

.selection-action:focus-visible {
  outline: 2px solid var(--action);
  outline-offset: 3px;

.selection-slot {
  display: grid;

  opacity: 0;

.selection-reveal {

  function transitionResults(region, html) {
    if (!region) return;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const previousHeight = region.getBoundingClientRect().height;
    region.getAnimations().forEach((a) => a.cancel());
    const next = document.createElement("div");
    next.innerHTML = html;
    const oldTable = region.querySelector("table"),
      newTable = next.querySelector("table");
    if (oldTable && newTable && oldTable.className === newTable.className) {
      const key = (row) =>
        row.querySelector("[data-action=detail]")?.dataset.id;
      const existing = new Map(
        [...oldTable.tBodies[0].rows].map((row) => [
          key(row),
          { row, y: row.getBoundingClientRect().top },
        ]),
      );
      const incoming = [...newTable.tBodies[0].rows].map((row) => ({
        key: key(row),
        fresh: row,
      }));
      oldTable.tBodies[0].replaceChildren(
        ...incoming.map((item) => {
          const prior = existing.get(item.key)?.row;
          if (!prior) return item.fresh;
          [...item.fresh.cells].forEach((cell, i) => {
            if (prior.cells[i]?.innerHTML !== cell.innerHTML)
              prior.cells[i].innerHTML = cell.innerHTML;
          });
          return prior;
        }),
      );
      for (const cls of ["list-meta", "list-bottom"]) {
        const old = region.querySelector("." + cls),
          replacement = next.querySelector("." + cls);
        if (old && replacement) old.innerHTML = replacement.innerHTML;
      }
      if (!reduced)
        incoming.forEach((item) => {
          const prior = existing.get(item.key),
            row = prior?.row || item.fresh;
          const y = row.getBoundingClientRect().top;
          row.getAnimations().forEach((a) => a.cancel());
          if (prior && Math.abs(prior.y - y) > 1)
            row.animate(
              [
                { transform: `translateY(${prior.y - y}px)` },
                { transform: "none" },
              ],
              { duration: 240, easing: "cubic-bezier(.22,1,.36,1)" },
            );
          else if (!prior)
            row.animate(
              [
                { opacity: 1, transform: "translateY(4px)" },
                { opacity: 1, transform: "none" },
              ],
              { duration: 200, easing: "cubic-bezier(.22,1,.36,1)" },
            );
        });
    } else {
      region.innerHTML = html;
    }
    if (reduced) {
      region.style.overflow = "";
      return;
    }
    const nextHeight = region.getBoundingClientRect().height;
    if (Math.abs(previousHeight - nextHeight) < 1) return;
    region.style.overflow = "clip";
    const animation = region.animate(
      [{ height: previousHeight + "px" }, { height: nextHeight + "px" }],
      { duration: 240, easing: "cubic-bezier(.22,1,.36,1)" },
    );
    region._resultAnimation = animation;
    const settle = () => {
      if (region._resultAnimation === animation) {
        region.style.overflow = "";
        delete region._resultAnimation;
      }
    };
    animation.onfinish = settle;
    animation.oncancel = settle;
  }

  function autoSize(input) {
    if (input.tagName !== "TEXTAREA") return;

  function clearFieldError(input) {
    input.removeAttribute("aria-invalid");
    const error = input.closest(".form-field")?.querySelector(".input-error");
    error?.remove();
  }
  function validateField(input) {
    clearFieldError(input);
    let message = "";
    if (input.required && !input.value.trim())
      message =
        "请填写" +
        (input.closest(".form-field")?.querySelector("span")?.textContent ||
          "此项");
    if (!message) return true;
    input.setAttribute("aria-invalid", "true");
    const error = document.createElement("small");
    error.className = "input-error";
    error.textContent = message;
    error.setAttribute("role", "alert");
    input.closest(".form-field")?.append(error);
    return false;

  function wireFields(root) {
    const form = root.querySelector("form");
    if (!form) return;
    form.noValidate = true;
    const fields = $$("textarea,input:not([type=radio])", form);
    fields.forEach(autoSize);
    const dirty = ["section-form", "role-form"].includes(form.id);
    const initial = JSON.stringify([...new FormData(form)]);
    const submit = root.querySelector("[type=submit]");
    const sync = () => {
      if (submit && dirty)
        submit.disabled = JSON.stringify([...new FormData(form)]) === initial;
    };
    sync();
    form.addEventListener("input", (e) => {
      if (e.target.matches("input,textarea")) {
        clearFieldError(e.target);
        autoSize(e.target);
      }
      sync();
    });
    form.addEventListener("change", sync);
    form.addEventListener("focusout", (e) => {
      if (
        e.target.matches("textarea,input:not([type=radio])") &&
        e.target.required
      )
        validateField(e.target);
    });

      "submit",
      (e) => {
        const valid = fields.map(validateField);
        if (valid.includes(false)) {
          e.preventDefault();
          e.stopImmediatePropagation();
          fields[valid.indexOf(false)].focus();
        }
      },
      true,
    );
  }

/*

    the buttons and the facts, the picture settling), about 1.1 s, when the head line set html.m-enter
    before the first paint:

    instead of waiting 150ms again; it stays while the pointer is on the word or its panel.
  - tabs: every .tabs[role=tablist] gets one indicator that slides to the selected tab (system.js
    still selects; this follows aria-selected).
  - numbers: [data-m-count] on a stat ticks from 0 to its own text once, when 60% of it is on
    screen (1.2 s, ease-out); prefix, suffix, decimals and thousands separators are kept. The
    number's width is measured once the web fonts are in and again when it is first seen (a stat

    system's pause button (one per panel, shared with ui.js). ui.js restarts its own fragments.

const reducedQ = matchMedia('(prefers-reduced-motion: reduce)');
const reduced = () => reducedQ.matches;
const shot = () => /HeadlessChrome/.test(navigator.userAgent) && html.dataset.motion !== 'live';
const jump = (el, on) => { el.classList.toggle('is-jump', on); };

/* ---------------------------------------------------------------- nav */
function nav() {
  const bar = document.querySelector('.nav');
  const links = bar?.querySelector('.nav__links');
  if (!links || bar.dataset.mNav) return;
  bar.dataset.mNav = '1';   // no pill under the words (ST-08, ST-11): system.css draws their underline

  // one menu open: the next word swaps the panel at once (figma.com); leaving the bar closes softly
  let t = 0;
  bar.querySelectorAll('.nav__item').forEach(item => {
    const has = !!item.querySelector('.nav__menu');
    item.addEventListener('pointerenter', () => {
      clearTimeout(t);
      // 150ms: the panel has started to show (motion.css lets it finish its own fade)
      if (has) t = setTimeout(() => bar.classList.add('m-menu-open'), 150);
      else bar.classList.remove('m-menu-open');
    });
  });
  bar.addEventListener('pointerleave', () => { clearTimeout(t); bar.classList.remove('m-menu-open'); });
}

/* ---------------------------------------------------------------- tabs */
function tabs() {
  document.querySelectorAll('.tabs[role="tablist"], [role="tablist"].m-tabs').forEach(list => {
    if (!list.querySelector('[role="tab"]') || list.querySelector(':scope > .m-tab-ind')) return;
    const ind = document.createElement('span');
    ind.className = 'm-tab-ind';
    ind.setAttribute('aria-hidden', 'true');
    list.prepend(ind);
    list.classList.add('m-has-ind');
    let instant = true, at = null;
    const set = (b, sx = 1, sy = 1) => {
      ind.style.setProperty('--x', `${b.x}px`); ind.style.setProperty('--y', `${b.y}px`);
      ind.style.setProperty('--w', `${b.w}px`); ind.style.setProperty('--h', `${b.h}px`);
      ind.style.setProperty('--sx', String(sx)); ind.style.setProperty('--sy', String(sy));
    };
    // the pill travels by transform only: it takes the new tab's size at once, is drawn scaled to the
    // old tab's size at the old place, and settles to scale 1 at the new place (motion.css)
    const place = () => {
      const sel = list.querySelector('[role="tab"][aria-selected="true"]');
      if (!sel) { ind.style.opacity = '0'; return; }
      ind.style.opacity = '';
      const to = { x: sel.offsetLeft, y: sel.offsetTop, w: sel.offsetWidth, h: sel.offsetHeight };
      if (instant || reduced() || !at || !to.w || !to.h) { jump(ind, true); set(to); ind.getBoundingClientRect(); jump(ind, false); }
      else {
        jump(ind, true);
        set({ ...to, x: at.x, y: at.y }, at.w / to.w, at.h / to.h);
        ind.getBoundingClientRect();
        jump(ind, false);
        set(to);
      }
      at = to;
      instant = false;
    };
    place();
    new MutationObserver(place).observe(list, { subtree: true, attributes: true, attributeFilter: ['aria-selected'] });
    new ResizeObserver(() => { instant = true; place(); }).observe(list);
    document.fonts?.ready.then(() => { instant = true; place(); });
  });
}

/* ---------------------------------------------------------------- numbers */
// the first number in the element's text: "8,402", "4.2", "64%", "EUR 1.200", "12k"
// separators: . , and the no-break spaces (U+00A0, U+202F); a plain space ends the number ("12 4 h" is 12)
const NUM = /\d+(?:[.,\u00A0\u202F]\d+)*/;
function parse(text) {
  const m = text.match(NUM);
  if (!m) return null;
  const raw = m[0];
  const seps = raw.match(/[^\d]/g) || [];
  let dec = '', group = '', decimals = 0;
  const lastSep = raw.search(/[^\d](?=\d+$)/);
  if (lastSep >= 0) {
    const tail = raw.length - lastSep - 1;
    // a last separator before exactly three digits groups thousands; otherwise it is the decimal point
    if (tail === 3 && !(seps.length === 1 && raw[lastSep] === '.' && /^0/.test(raw))) group = raw[lastSep];
    else { dec = raw[lastSep]; decimals = tail; group = seps.length > 1 ? seps[0] : ''; }
  }
  const intPart = dec ? raw.slice(0, lastSep) : raw;
  const value = parseFloat(intPart.replace(/[^\d]/g, '') + (dec ? '.' + raw.slice(lastSep + 1) : ''));
  return { index: m.index, raw, value, dec, group, decimals };
}
function format(v, p) {
  let [i, d] = v.toFixed(p.decimals).split('.');
  if (p.group) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, p.group);
  return d ? i + p.dec + d : i;
}
// the web fonts, or 3 s at most: a number measured in the fallback font comes out narrower
const fontsIn = () => Promise.race([document.fonts?.ready ?? Promise.resolve(), new Promise(r => setTimeout(r, 3000))]);
function counts() {
  const els = [...document.querySelectorAll('[data-m-count]')].filter(el => !el.__mCount);
  if (!els.length || reduced() || shot()) return;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.__mCount?.hit(); }), { threshold: 0.6 });
  const ro = new ResizeObserver(es => es.forEach(e => e.target.__mCount?.arm()));
  const items = [];
  els.forEach(el => {
    const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let node, p;
    while ((node = walk.nextNode()) && !(p = parse(node.data))) { /* next */ }
    if (!node || !p) return;
    // the number gets its own span, as wide as the final number and right-aligned, so nothing beside it
    // moves. Until it is measured it shows its own text, never a 0
    const after = node.splitText(p.index);
    after.splitText(p.raw.length);
    const span = document.createElement('span');
    span.className = 'm-count__n';
    span.style.display = 'inline-block';
    span.style.textAlign = 'right';
    span.textContent = p.raw;
    after.replaceWith(span);
    const ms = +el.dataset.mCount || 1200;
    let state = 'wait', timer = 0;          // wait (own text) -> armed (0, width held) -> run -> done
    const stop = () => { clearTimeout(timer); io.unobserve(el); ro.unobserve(el); };
    const onScreen = () => {
      const r = span.getBoundingClientRect();
      return r.width > 0 && r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth && document.visibilityState === 'visible';
    };
    // the safety net: a stat on screen for 6 s that the observer never reported shows its own text
    const watch = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (state !== 'armed') return;
        if (onScreen()) { state = 'done'; stop(); span.textContent = p.raw; } else watch();
      }, 6000);
    };
    const ctl = {
      /** measure the final number in the page's font and hold its width; false while it has none (hidden) */
      arm() {
        if (state === 'run' || state === 'done') return false;
        span.textContent = p.raw;
        span.style.minWidth = '';
        const w = span.getBoundingClientRect().width;
        if (!w) { state = 'wait'; clearTimeout(timer); return false; }
        span.style.minWidth = `${w}px`;
        span.textContent = format(0, p);
        if (state !== 'armed') { state = 'armed'; watch(); }
        return true;
      },
      /** print: stop waiting and show the written number */
      show() { if (state === 'done') return; state = 'done'; stop(); span.textContent = p.raw; },
      /** first seen: measure again (a font or a tab that changed since), then tick once */
      hit() {
        if (state === 'run' || state === 'done' || !ctl.arm()) return;
        state = 'run';
        stop();
        const t0 = performance.now();
        const step = now => {
          const k = Math.min(1, (now - t0) / ms);
          span.textContent = k < 1 ? format(p.value * (1 - Math.pow(1 - k, 4)), p) : p.raw;
          if (k < 1) requestAnimationFrame(step); else state = 'done';
        };
        requestAnimationFrame(step);
      },
    };
    el.__mCount = ctl;
    items.push(el);
  });
  // measured only once the fonts are in; the resize observer measures again when a hidden stat shows
  fontsIn().then(() => items.forEach(el => { el.__mCount.arm(); ro.observe(el); io.observe(el); }));
  // a printed page never scrolls the stats into view: each prints its own number
  addEventListener('beforeprint', () => items.forEach(el => el.__mCount.show()));
}

/* ---------------------------------------------------------------- loops inside cards */
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4.25" y="3.25" width="2.75" height="9.5" rx="0.9"/><rect x="9" y="3.25" width="2.75" height="9.5" rx="0.9"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.25 3.7v8.6c0 .62.68 1 1.2.66l6.5-4.3c.47-.31.47-1 0-1.32l-6.5-4.3c-.52-.34-1.2.04-1.2.66Z"/></svg>';
const boxOf = el => el.closest('[data-ui-pause-host], .panel__screen, .panel, .frame') || el;
const hostOf = el => el.closest('.card, .tile, .menu-card, a') || boxOf(el);

function restart(loop) {
  if (reduced() || loop.classList.contains('is-m-paused')) return;
  // the page's keyframe loops only: a hover transition in the panel (the pause button's) is no cycle.
  // ui.js fragments in the card restart by themselves
  const anims = loop.getAnimations({ subtree: true }).filter(a => typeof CSSAnimation === 'function' && a instanceof CSSAnimation);
  if (!anims.length) return;
  const dur = a => Number(a.effect?.getComputedTiming().duration) || 0;
  const main = anims.reduce((m, a) => (dur(a) > dur(m) ? a : m));
  const d = dur(main), t = Number(main.currentTime) || 0;
  // restart only when the cycle is past its first quarter, so a quick in-and-out never stutters
  if (!d || (t % d) / d > 0.25) anims.forEach(a => { a.currentTime = 0; });
}
function setPaused(box, paused) {
  box.querySelectorAll('[data-m-loop]').forEach(l => l.classList.toggle('is-m-paused', paused));
  if (box.matches('[data-m-loop]')) box.classList.toggle('is-m-paused', paused);
}
function pauseButton(loop) {
  const box = boxOf(loop);
  if (box.querySelector(':scope > .loop-pause')) return;   // ui.js or the page put one there: it is shared
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'loop-pause m-own';
  const show = paused => {
    btn.innerHTML = paused ? ICON_PLAY : ICON_PAUSE;
    btn.setAttribute('aria-label', `${paused ? 'Play' : 'Pause'} animation`);
    btn.title = btn.getAttribute('aria-label');
    btn.classList.toggle('is-paused', paused);
  };
  show(false);
  if (getComputedStyle(box).position === 'static') box.style.position = 'relative';
  box.append(btn);
  btn.__show = show;
}
function loops() {
  const els = [...document.querySelectorAll('[data-m-loop]')].filter(el => !el.__mLoop);
  if (!els.length) return;
  if (reduced() || matchMedia('(max-width: 639px)').matches) return;   // motion.css holds them on their finished picture
  const io = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('is-m-off', !e.isIntersecting)), { rootMargin: '48px' });
  els.forEach(el => {
    el.__mLoop = true;
    io.observe(el);
    pauseButton(el);
    hostOf(el).addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') restart(el); });   // a mouse or pen, never a tap
    hostOf(el).addEventListener('focusin', e => { if (!e.target.closest('.loop-pause')) restart(el); });
  });
}
// one listener for every pause button: its own (m-own) toggles; a ui.js one is mirrored after ui.js ran
document.addEventListener('click', e => {
  const btn = e.target.closest('.loop-pause');
  if (!btn) return;
  const box = btn.parentElement;
  if (btn.classList.contains('m-own')) {
    const paused = !btn.classList.contains('is-paused');
    btn.__show(paused);
    setPaused(box, paused);
    box.querySelectorAll('[data-ui]').forEach(r => { try { paused ? r.__ui?.pause() : r.__ui?.resume(); } catch { /* none */ } });
  } else setPaused(box, btn.classList.contains('is-paused'));
});

/* ---------------------------------------------------------------- switches */
document.addEventListener('click', e => {
  const sw = e.target.closest('.m-switch');
  if (!sw || e.defaultPrevented) return;
  sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true'));
});

/* ---------------------------------------------------------------- the hero's entrance */
// Once, on load (motion.md, The hero's entrance): the h1 rises line by line out of its masks, then what
// follows it (the lead, each button, the facts) fades up 60ms apart, while the picture settles from a
// slight scale; about 1.1 s in all, ease-out, transform and opacity only. motion.css hides the words
// (never the picture) only while the head line's html.m-enter is on and its 700ms safety mark
// (m-enter-done) is not; the picture waits at its start scale and settles by a CSS transition, so it
// never blinks however late this file is. Without script, under reduced motion and in print the hero
// simply stands; when this file is later than the mark, the words fade in by CSS and the hero stands.
// The h1 gets its word masks for the length of the entrance and its own nodes back afterwards.
const ENTER_MEDIA = '[data-enter-media], .hero__bg, .hero__media, .hero__stage, .hero__art, .hero__window, .hero-visual, .ly-collage';
const ENTER_TEXT = 'h1 ~ *, :has(> h1) ~ *, :has(~ h1)';
const ENTER_LEAF = 'p, dl, ul, ol, a, button, img, picture, video, figure, blockquote, h2, h3, .pill, .btn';
function maskWords(h1) {
  // an h1 another script reworks (layout.js: a live word, letters, a picture in the line) rises whole
  if (h1.matches('[data-ly-letters], [data-enter-whole]') || h1.querySelector('.ly-word, .ly-pic, .ly-mark, svg, img')) return null;
  const own = document.createDocumentFragment();
  own.append(...h1.childNodes);
  const copy = own.cloneNode(true);
  const words = [];
  const walk = node => [...node.childNodes].forEach(n => {
    if (n.nodeType === 1) return walk(n);
    if (n.nodeType !== 3) return;
    const frag = document.createDocumentFragment();
    n.textContent.split(/(\s+)/).forEach(part => {
      if (!part) return;
      if (/^\s+$/.test(part)) { frag.append(part); return; }
      const w = document.createElement('span'), i = document.createElement('span');
      w.className = 'm-w'; i.className = 'm-w__in'; i.textContent = part;
      w.append(i); frag.append(w); words.push(w);
    });
    n.replaceWith(frag);
  });
  walk(copy);
  const label = h1.hasAttribute('aria-label');
  if (!label) h1.setAttribute('aria-label', own.textContent.replace(/\s+/g, ' ').trim());
  h1.append(copy);
  h1.querySelectorAll('.m-w').forEach(w => w.setAttribute('aria-hidden', 'true'));
  // words grouped into the lines the browser set them on
  const lines = [];
  let top = null;
  words.forEach(w => { const t = w.getBoundingClientRect().top; if (top === null || Math.abs(t - top) > 3) { lines.push([]); top = t; } lines[lines.length - 1].push(w.firstChild); });
  return { lines, restore() { h1.replaceChildren(own); if (!label) h1.removeAttribute('aria-label'); } };
}
function enterSteps(hero, h1, media) {
  // what follows (and precedes) the h1 in its column, as whole blocks in reading order; a box of
  // layout (a div with no words of its own) is opened, a button row gives one step a button.
  // A picture, window or collage (or a box round one) is never opened: it stands as one block and
  // settles by itself (motion.css), even when it carries words of its own (a menu card, a note)
  const out = [];
  const take = el => {
    if (el === h1 || el.contains(h1) || out.includes(el) || el.matches('img, picture, video, canvas, .frame__img')) return;
    if (media.includes(el) || media.some(m => el.contains(m))) return;
    if (el.matches('.btn-row')) { [...el.children].forEach(take); return; }
    const own = [...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
    if (own || !el.children.length || el.matches(ENTER_LEAF)) out.push(el);
    else [...el.children].forEach(take);
  };
  hero.querySelectorAll(ENTER_TEXT).forEach(take);
  return out.filter(el => !el.closest('[aria-hidden="true"]') && !out.some(o => o !== el && o.contains(el)))
    .sort((a, b) => (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1));
}
function enter() {
  const hero = document.querySelector('.hero[data-enter]:not([data-enter="off"])');
  if (!hero || hero.classList.contains('is-entered') || hero.classList.contains('is-entering')) return;
  // still: the picture takes its place at once (no settle); otherwise the CSS settle and fade run out first
  const done = (still = false) => { if (still) hero.classList.add('is-still'); hero.classList.add('is-entered'); };
  const late = () => setTimeout(done, 1150);
  // the head line did not run, reduced motion, a headless shot (it sees the hero at rest, as it sees the
  // final number, unless data-motion="live") or the visitor is already below the hero (a reload half way
  // down): the hero stands as written. The safety mark has passed: motion.css is fading the words in and
  // settling the picture; the hero is marked done once they are through
  if (!html.classList.contains('m-enter') || reduced() || shot() || hero.getBoundingClientRect().bottom < 0) return done(true);
  if (html.classList.contains('m-enter-done')) return late();
  const h1 = hero.querySelector('h1');
  if (!h1) return done(true);
  const media = [...hero.querySelectorAll(ENTER_MEDIA)].filter((m, i, all) => !all.some(o => o !== m && o.contains(m)));
  const steps = enterSteps(hero, h1, media);
  const EASE = 'cubic-bezier(.22, 1, .36, 1)';
  const anims = [];
  let masks = null, over = false;
  const finish = () => {
    if (over) return;
    over = true;
    anims.forEach(a => { try { a.cancel(); } catch { /* gone */ } });
    masks?.restore();
    hero.classList.remove('is-entering');
    done();
  };
  // the fonts first (a line set in the fallback face breaks elsewhere), 250ms at most: the words are
  // hidden meanwhile, so nothing is seen twice
  Promise.race([document.fonts?.ready ?? Promise.resolve(), new Promise(r => setTimeout(r, 250))]).then(() => {
    if (html.classList.contains('m-enter-done') && !hero.classList.contains('is-entering')) { over = true; return late(); }   // the safety mark won: CSS shows it
    masks = maskWords(h1);
    // .is-entering ends the CSS hold: the words are held by their animations from here, and the
    // picture starts its CSS settle in the same frame
    hero.classList.add('is-entering');
    const lines = masks ? masks.lines : [[h1]];
    const lineStep = Math.min(80, 240 / Math.max(1, lines.length - 1));
    // a word starts wholly below its mask, which reaches .12em under the line: no tops show before it rises
    lines.forEach((ws, k) => ws.forEach(w => anims.push(w.animate(masks
      ? [{ transform: 'translateY(calc(100% + .2em))' }, { transform: 'none' }]
      : [{ transform: 'translateY(.35em)', opacity: 0 }, { transform: 'none', opacity: 1 }],
      { duration: 700, delay: 80 + k * lineStep, easing: EASE, fill: 'both' }))));
    // a line above the h1 (a notice, a pill) comes with its first line; what follows starts as its
    // last line is half way up
    const after = 80 + (lines.length - 1) * lineStep + 220;
    let k = 0;
    steps.forEach(el => {
      const above = !!(el.compareDocumentPosition(h1) & Node.DOCUMENT_POSITION_FOLLOWING);
      // the rise is added to whatever transform the part has of its own; the fade replaces its opacity
      const t = { duration: 520, delay: above ? 40 : after + Math.min(k++, 6) * 60, easing: EASE, fill: 'both' };
      anims.push(el.animate([{ opacity: 0 }, { opacity: 1 }], t), el.animate([{ transform: 'translateY(12px)' }, { transform: 'none' }], { ...t, composite: 'add' }));
    });
    // a panel the words sit on stands from the first paint (it was never hidden, so it never blinks);
    // the pictures settle by CSS over 1.1 s: the hero is done when both are through
    anims.push({ finished: new Promise(r => setTimeout(r, 1150)), cancel() {} });
    Promise.all(anims.map(a => a.finished)).then(finish, finish);
  }).catch(finish);
  setTimeout(finish, 2400);   // whatever stalls (a hidden tab), the hero stands after 2.4 s
}

/* ---------------------------------------------------------------- start */
export function init() {
  if (html.dataset.motion === 'off') { html.classList.add('m-enter-done'); return; }
  if (!html.hasAttribute('data-motion')) html.setAttribute('data-motion', '');
  try { enter(); } catch (e) { console.warn('motion.js: enter', e); document.querySelector('.hero[data-enter]')?.classList.add('is-entered'); }
  try { nav(); } catch (e) { console.warn('motion.js: nav', e); }
  try { tabs(); } catch (e) { console.warn('motion.js: tabs', e); }
  try { counts(); } catch (e) { console.warn('motion.js: counts', e); }
  try { loops(); } catch (e) { console.warn('motion.js: loops', e); }
}
/** call again after the page adds markup (a tab list, a stat, a loop) */
export const refresh = init;
export default { init, refresh };

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
else init();
