<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="csrf" content="{{ csrf }}" />
    <title>客户工作台 · M1 试点</title>
    <link rel="stylesheet" href="/static/workspace.css" />
    <script nonce="{{ nonce }}" src="/static/workspace.js" defer></script>
  </head>
  <body>
    <aside>
      <div class="brand">
        半托管欧区<br />备货用户助手<small>客户文档 · M1 试点</small>
      </div>
      <nav aria-label="工作台">
        <button data-view="today" aria-current="page">今日</button
        ><button data-view="customers">客户</button
        ><button data-view="review">待确认</button
        ><button data-view="pilot">试点与进度</button>
      </nav>
      <a class="sidebar-link" href="/">返回原工作台</a>
    </aside>
    <main>
      <div class="top">
        <span class="demo">新引擎试点 · 真实归档</span
        ><span>微信仍由你发送</span>
      </div>
      <h1 id="title">今日</h1>
      <p class="subtitle">
        同一联系人，一份持续更新的档案。试点结果与旧客户库独立。
      </p>
      <p id="status" role="status"></p>
      <div id="content"></div>
    </main>
    <dialog aria-labelledby="detail-title">
      <div class="sheet-head row">
        <h2 id="detail-title"></h2>
        <button id="close" aria-label="关闭详情">关闭</button>
      </div>
      <div class="sheet-body">
        <p id="detail-status" role="alert"></p>
        <div id="detail"></div>
      </div>
    </dialog>
  </body>
</html>
