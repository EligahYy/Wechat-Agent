<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="csrf" content="{{ csrf }}" />
    <title>半托管欧区备货用户助手</title>
    <link rel="stylesheet" href="/static/workspace.css" />
    <script
      nonce="{{ nonce }}"
      src="/static/workspace.js"
      type="module"
    ></script>
  </head>
  <body>
    <aside>
      <div class="brand">
        半托管欧区<br />备货用户助手<small>完整客户资料与今日行动</small>
      </div>
      <nav aria-label="工作台">
        <button data-view="dashboard" aria-current="page">数据大屏</button>
        <button data-view="settings">设置</button>
      </nav>
      <footer class="sidebar-footer">本机归档 · 人工发送</footer>
    </aside>
    <main>
      <div class="top">
        <span class="demo">客户工作台 · 本地归档</span
        ><span>微信仍由你发送</span>
      </div>
      <h1 id="title">数据大屏</h1>
      <p class="subtitle">客户、跟进与资料进度，在一处查看和处理。</p>
      <p id="status" role="status"></p>
      <div id="content"></div>
    </main>
    <dialog aria-labelledby="detail-title">
      <div class="sheet-head row">
        <h2 id="detail-title"></h2>
        <button id="close" aria-label="关闭详情">关闭</button>
      </div>
      <div class="sheet-body">
        <p id="detail-status" role="alert"></p>
        <div id="detail"></div>
      </div>
    </dialog>
  </body>
</html>
