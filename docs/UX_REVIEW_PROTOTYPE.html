<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>半托管欧区备货用户助手 · 交互评审原型</title>
<style>
:root{--ink:#23362f;--muted:#738078;--line:#e4e9e3;--green:#2d604d;--paper:#fafbf8}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer;padding:9px 16px;border:1px solid var(--line);border-radius:9px;background:white;color:inherit}button:hover{background:#edf3ec}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#224d3d}.quiet{border:0;background:transparent}.prototype{padding:9px 24px;background:#e9efe5;text-align:center;font-size:12px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:95vh}nav{padding:35px 20px;border-right:1px solid var(--line)}nav strong{display:block;margin:0 12px 38px;font-size:17px}nav button{display:block;width:100%;text-align:left;border:0;background:none;margin:8px 0}nav button.active{background:#e4eddf;color:#284d3c}main{max-width:1140px;width:100%;padding:42px 50px;margin:auto;margin-top:0}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px}h1{font-size:32px;letter-spacing:-1px;margin:7px 0}h2{font-size:19px;margin:0 0 8px}p{margin:8px 0}.muted{color:var(--muted);font-size:13px}.eyebrow{color:var(--muted);font-size:12px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:24px;margin:18px 0}.identity{display:flex;align-items:center;gap:12px}.avatar{background:#eaf0e6;border-radius:12px;padding:13px 18px;font-weight:600}.tag{font-size:12px;border-radius:20px;padding:4px 10px;background:#eef2ea;color:#596b5e}.warn{background:#f5efdf;color:#907342}.card-top{display:flex;justify-content:space-between;gap:15px}.source{background:#f7f9f4;border-radius:9px;padding:12px 15px;margin:15px 0}.actions{display:flex;gap:8px;align-items:center;margin-top:15px;flex-wrap:wrap}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0}.tabs button{background:transparent;border-color:transparent}.tabs button.active{background:#e5eddf}.search{border:1px solid var(--line);border-radius:10px;padding:12px 15px;width:100%;background:white}.conversation{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:18px 4px;border-bottom:1px solid var(--line)}.conversation:last-child{border:0}.conversation input{width:17px;height:17px}.conversation button{white-space:nowrap}.scope-name{font-weight:600}.bulk{position:sticky;bottom:18px;background:var(--ink);color:white;border-radius:12px;padding:14px 20px;box-shadow:0 8px 30px #0002;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bulk button{color:var(--ink)}.empty{padding:50px;text-align:center;color:var(--muted)}dialog{border:0;border-left:1px solid var(--line);padding:30px;max-width:520px;width:100%;height:100dvh;max-height:100dvh;margin:0 0 0 auto;color:var(--ink);background:var(--paper);box-shadow:-8px 0 45px #20372918}dialog::backdrop{background:#253b2e38}.close{float:right}.quote{border-left:2px solid #94ad92;padding-left:14px;margin:20px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 20px;border-radius:11px;z-index:5;max-width:94vw}.toast button{margin-left:14px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{font-size:13px;padding:12px;background:#f3eedf;border-radius:9px}.dialog-actions{margin-top:26px}footer{margin-top:30px;color:var(--muted);font-size:12px} @media(max-width:800px){.shell{display:block}nav{padding:12px;border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px}nav strong{width:100%;margin:0 8px 8px}nav button{width:auto;padding:7px 12px;margin:0}main{padding:25px 18px}h1{font-size:27px}.card-top{flex-wrap:wrap}header{align-items:flex-start}.conversation{grid-template-columns:20px 1fr}.conversation button{grid-column:2;justify-self:start}.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:no-preference){dialog[open]{animation:enter .16s ease}button{transition:background .13s ease}@keyframes enter{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
</style>
<div class="prototype">交互评审原型 · 全部为虚构数据 · 仅演示今日跟进、会话排除与微信定位，不连接微信或模型，刷新即重置</div>
<div class="shell"><nav aria-label="主导航"><strong>半托管欧区<br>备货用户助手</strong><button data-page="today" class="active">今日</button><button data-page="customers">客户</button><button data-page="scope">会话范围</button></nav><main id="main"></main></div>
<dialog id="detail"><button class="quiet close" id="close" aria-label="关闭侧栏">✕</button><div id="detail-body"></div></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chats=[
{id:'merchant',name:'欧洲备货三方群 · 张先生',type:'商家三方群',state:'normal',reason:'德国第二批，待确认附加费',person:'微信备注：欧洲商家张总',task:true},
{id:'buyer',name:'示例买手 · 李女士',type:'买手协作',state:'suggested',reason:'内部选品及价格协商，没有商家备货需求',person:'私信 · 李女士'},
{id:'product',name:'示例产品协作群',type:'内部同事',state:'excluded',reason:'人工排除 · 内部产品沟通',person:'群聊 · 12位参与者'},
{id:'provider',name:'示例头程服务商对接群',type:'纯服务商',state:'suggested',reason:'服务商之间沟通渠道价卡，未出现商家需求',person:'群聊 · 6位参与者'},
{id:'shipped',name:'示例商家王先生 · 第一批',type:'本批已发货',state:'excluded',reason:'人工整群排除 · 本批已发，不产生新备货任务',person:'群聊 · 王先生'},
{id:'unknown',name:'示例新加入工作群',type:'类型待识别',state:'unknown',reason:'缺少足够身份信息，暂不产生任务',person:'尚未确认角色'}
];
let page='today',filter='all',query='',selected=new Set(),undo=null,returnFocus=null;
const names={normal:'正常',suggested:'建议排除',excluded:'已排除',unknown:'待识别'};
function notify(text,restore){undo=restore||null;$('#toast').innerHTML=esc(text)+(restore?' <button id="undo">撤销</button>':'');$('#toast').classList.remove('hidden');}
function open(body){returnFocus=document.activeElement;$('#detail-body').innerHTML=body;$('#detail').showModal();}
function close(){$('#detail').close();returnFocus?.focus();}
$('#close').onclick=close;$('#detail').addEventListener('click',e=>{if(e.target===$('#detail'))close()});
function sourceCard(){return '<div class="source"><strong>回微信找到张先生</strong><p>备注：欧洲商家张总 · 昵称：张先生</p><p>来源群：欧洲备货三方群 · 张先生</p><p class="muted">群中未必已加好友，可在来源群联系。这里不直接跳转微信。</p><button data-copy="欧洲商家张总">复制备注</button> <button data-copy="欧洲备货三方群 · 张先生">复制群名</button></div>';}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const main=$('#main');
if(page==='today'){const available=chats[0].state==='normal'&&chats[0].task;main.innerHTML='<header><div><span class="eyebrow">11月5日 · 虚构业务场景</span><h1>今天，推进一件有价值的事</h1><p class="muted">'+(available?'1位客户需要联系':'当前没有到期行动')+' · 无关协作与已结束业务不挤进今日</p></div></header>'+ (available?'<article class="panel"><div class="card-top"><div class="identity"><span class="avatar">张</span><div><h2>张先生</h2><span class="muted">微信备注：欧洲商家张总</span></div></div><span class="tag">今天14:00前</span></div><h2 style="margin-top:22px">德国第二批 · 确认附加费</h2><p>昨天约定今天确认价格，当前没有新的答复证据。</p><div class="source">在「欧洲备货三方群 · 张先生」联系<br><span class="muted">11/04 16:20 · “明天下午前确认给您。”</span></div><div class="actions"><button class="primary" id="followup">查看跟进建议</button><button id="result">记录结果</button><button class="quiet" data-exclude="merchant">不需要跟进</button></div></article>':'<div class="panel empty">没有需要处理的行动。<br>已排除会话继续归档，未来到期的计划不会提前出现。</div>')+'<div class="row muted">2类会话建议排除 <button data-page="scope" class="quiet">查看会话范围 →</button></div><footer>原型未演示模型进度与待确认，完整状态规范见设计文档第9节。</footer>';}
if(page==='customers'){main.innerHTML='<header><div><span class="eyebrow">真实身份先于客户画像</span><h1>客户</h1><p class="muted">人物、商家和本批需求分开保存</p></div></header><article class="panel"><div class="identity"><span class="avatar">张</span><div><h2>张先生</h2><span class="muted">欧洲商家张总 · 德国市场 · 当前有1批备货</span></div></div>'+sourceCard()+'<button id="customer-detail">查看客户与业务证据</button></article><div class="note">身份不足的候选单独提示，不用“联系人＋ID后缀”充当可执行客户。</div>';}
if(page==='scope'){main.innerHTML='<header><div><span class="eyebrow">只让有效商家需求进入跟进</span><h1>会话范围</h1><p class="muted">白名单内免跟进。人物、整个会话与本批完结使用不同作用范围。</p></div></header><input class="search" id="search" aria-label="搜索会话" placeholder="搜索备注、昵称、群名" value="'+esc(query)+'"><div class="tabs" role="group" aria-label="会话状态">'+Object.entries({all:'全部',normal:'正常',suggested:'建议排除',excluded:'已排除（白名单）',unknown:'待识别'}).map(([k,v])=>'<button data-filter="'+k+'" class="'+(filter===k?'active':'')+'">'+v+'</button>').join('')+'</div><div class="panel" id="list"></div><div class="bulk" id="bulk"><span id="selection"></span><div><button id="select-visible">勾选当前结果</button> <button id="batch">批量排除</button></div></div>';renderList();$('#search').oninput=e=>{query=e.target.value;renderList()};}}
function visible(){return chats.filter(c=>(filter==='all'||c.state===filter)&&(c.name+c.person+c.type).includes(query));}
function renderList(){const rows=visible();$('#list').innerHTML=rows.length?rows.map(c=>'<div class="conversation"><input type="checkbox" aria-label="选择'+esc(c.name)+'" data-select="'+c.id+'" '+(selected.has(c.id)?'checked':'')+'><div><div class="scope-name">'+esc(c.name)+'</div><span class="tag '+(c.state==='suggested'?'warn':'')+'">'+names[c.state]+'</span> <span class="muted">'+esc(c.type)+'</span><p class="muted">'+esc(c.reason)+'</p></div><button '+(c.state==='excluded'?'data-restore':'data-exclude')+'="'+c.id+'">'+(c.state==='excluded'?'恢复':'排除')+'</button></div>').join(''):'<div class="empty">没有匹配会话。可更换筛选或搜索名称。</div>';$('#selection').textContent='已选择 '+selected.size+' 个会话 · 当前结果 '+rows.length+' 个';$('#batch').disabled=!selected.size;}
function exclude(ids,reason){const before=ids.map(id=>({...chats.find(c=>c.id===id)}));ids.forEach(id=>{const c=chats.find(c=>c.id===id);c.state='excluded';c.reason='人工排除 · '+reason});selected.clear();render();notify('已排除 '+ids.length+' 个会话，停止新分析和今日推荐，历史保留',()=>{before.forEach(old=>Object.assign(chats.find(c=>c.id===old.id),old));render()});}
function exclusionDialog(ids){open('<span class="eyebrow">免跟进白名单</span><h1>排除 '+ids.length+' 个会话</h1><p>将停止这些会话触发分析和今日行动，保留聊天档案。</p><div class="note">原型演示整个会话排除。设计中的跨群人物排除另有明确范围，不能误伤整个商家群。</div><h2 style="margin-top:24px">为什么排除？</h2><div class="grid">'+['买手／内部同事','纯服务商','已发货群，不再跟进','其他无关协作'].map(reason=>'<button data-reason="'+reason+'">'+reason+'</button>').join('')+'</div>');$('#detail-body').querySelectorAll('[data-reason]').forEach(b=>b.onclick=()=>{close();exclude(ids,b.dataset.reason)});}
document.addEventListener('change',e=>{if(e.target.dataset.select){e.target.checked?selected.add(e.target.dataset.select):selected.delete(e.target.dataset.select);renderList()}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.page){page=b.dataset.page;render()}
if(b.dataset.filter){filter=b.dataset.filter;render()}
if(b.id==='select-visible'){visible().forEach(c=>selected.add(c.id));renderList()}
if(b.id==='batch')exclusionDialog([...selected]);
if(b.dataset.exclude)exclusionDialog([b.dataset.exclude]);
if(b.dataset.restore){const c=chats.find(c=>c.id===b.dataset.restore),old={...c};c.state='normal';c.reason='已恢复范围，仍需实际有效需求才生成任务';render();notify('已恢复会话范围，不自动制造任务',()=>{Object.assign(c,old);render()});}
if(b.id==='undo'&&undo){const restore=undo;undo=null;restore();$('#toast').classList.add('hidden')}
if(b.id==='followup'||b.id==='customer-detail')open('<span class="eyebrow">张先生 · 德国第二批</span><h1>确认附加费</h1>'+sourceCard()+'<h2>为什么现在联系</h2><p>11月4日约定11月5日下午前答复，本批报价仍未解决。</p><div class="quote">11/04 16:18 张先生：“这批德国货麻烦确认一下附加费。”<br>11/04 16:20 我方：“明天下午前确认给您。”</div><h2>建议话术 · 待人工核对</h2><p>张总，您这批德国货的附加费我正在核对，确认后会把费用项一起同步到群里。</p><p class="muted">此为虚构示例，不代表已经查明报价，也未发送任何消息。</p><div class="actions"><button data-copy="张总，您这批德国货的附加费我正在核对，确认后会把费用项一起同步到群里。">复制草稿</button><button id="drawer-result">记录结果</button></div>');
if(b.id==='result'||b.id==='drawer-result'){if($('#detail').open)close();open('<span class="eyebrow">记录真实处理结果</span><h1>这次联系的结果</h1><p>复制话术不等于已联系。等待回复不等于已解决，本批完成也不关闭其他批次。</p><div class="grid dialog-actions">'+['已联系，等待回复','已解决本事项','本批已发货','暂不跟进'].map(v=>'<button data-outcome="'+v+'">'+v+'</button>').join('')+'</div>');}
if(b.dataset.outcome){chats[0].task=false;close();render();notify('已记录：'+b.dataset.outcome+'（仅原型状态）',()=>{chats[0].task=true;render()});}
if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);notify('已复制；未发送，未记录已联系')}catch{notify('浏览器未开放剪贴板，请手动选中示例文字复制')}}
});render();
</script></html>
