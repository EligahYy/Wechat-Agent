<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>半托管欧区备货用户助手 · 交互原型</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--surface:#fff;--ink:#1d1d1f;--muted:#626269;--line:#e5e5ea;--blue:#0066cc;--tint:#eaf3ff;--green:#217447;--glass:#f5f5f7ed;--shadow:0 20px 80px #0002}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 16px;transition:background .12s,transform .12s}button:hover{background:var(--tint)}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #338bee;outline-offset:3px}.primary{background:var(--blue);color:#fff;border-color:transparent}.primary:hover{background:#0055aa}.quiet{border-color:transparent;background:transparent;color:var(--blue)}aside{position:fixed;inset:0 auto 0 0;width:224px;padding:34px 20px;border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(20px)}.brand{font-size:16px;font-weight:650;line-height:1.5;padding:0 12px 34px}.brand small{font-size:12px;color:var(--muted);font-weight:400;display:block;margin-top:8px}nav{display:grid;gap:6px}nav button{border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:12px}nav button[aria-current=page]{background:var(--surface);box-shadow:0 1px 5px #0001;font-weight:600;color:var(--blue)}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;flex-shrink:0}.foot{position:absolute;bottom:26px;font-size:12px;color:var(--muted);padding:12px}main{margin-left:224px;padding:28px 48px 64px;max-width:1392px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:36px}.demo{border:1px solid var(--line);padding:5px 10px;border-radius:20px}h1{font-size:36px;line-height:1.15;letter-spacing:-1px;margin:0 0 12px}h2{font-size:20px;margin:0 0 8px}h3{font-size:17px;margin:0}p{margin:6px 0}.muted{color:var(--muted)}.subtitle{color:var(--muted);margin-bottom:28px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}.segments{padding:4px;display:flex;background:var(--line);border-radius:12px;gap:3px}.segments button{background:transparent;border:0;min-height:36px;padding:6px 15px;font-size:13px}.segments button[aria-selected=true]{background:var(--surface);box-shadow:0 1px 4px #0002}.cards{display:grid;gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.person{display:flex;align-items:center;gap:13px;min-width:0}.avatar{background:var(--tint);color:var(--blue);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.badge{font-size:12px;white-space:nowrap;background:var(--bg);padding:4px 9px;border-radius:7px;color:var(--muted)}.card .reason{font-size:18px;font-weight:550;margin:20px 0 5px}.meta{font-size:13px;color:var(--muted)}.actions{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:20px}.status{display:inline-flex;gap:8px;align-items:center}.dot{width:7px;height:7px;background:var(--green);border-radius:50%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat b{display:block;font-size:28px;margin:8px 0}input,select{background:var(--surface);border:1px solid var(--line);padding:11px 14px;border-radius:10px;min-height:44px;max-width:100%}input{width:100%}.search{max-width:360px}.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}.list .row{padding:16px 20px;border-bottom:1px solid var(--line)}.list .row:last-child{border:0}.empty{text-align:center;padding:64px 24px;border:1px dashed var(--line);border-radius:20px}.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:12px 0}.progress i{display:block;background:var(--blue);height:100%;width:68%}dialog{position:fixed;inset:0 0 0 auto;margin:0;height:100dvh;max-height:100dvh;width:min(620px,100vw);max-width:100vw;border:0;border-left:1px solid var(--line);padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}dialog[open]{animation:sheet .22s cubic-bezier(.2,.8,.2,1)}dialog::backdrop{background:#0004;backdrop-filter:blur(3px)}.sheet-head{position:sticky;top:0;background:var(--glass);backdrop-filter:blur(16px);padding:20px 28px;border-bottom:1px solid var(--line);z-index:1}.sheet-body{padding:28px}.section{padding:24px 0;border-bottom:1px solid var(--line)}.section:first-child{padding-top:0}details{margin-top:16px}summary{cursor:pointer;color:var(--blue);min-height:44px;display:flex;align-items:center}.evidence{border-left:2px solid var(--line);padding-left:14px;margin:14px 0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;background:var(--ink);color:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 18px;display:flex;align-items:center;gap:18px;max-width:94vw}.notice button{background:transparent;color:inherit;border-color:#888}.page-enter{animation:enter .18s ease-out}@keyframes enter{from{opacity:0;transform:translateY(4px)}}@keyframes sheet{from{opacity:0;transform:translateX(12px)}}[hidden]{display:none!important}.linkbutton{color:var(--blue);border:0;padding:0;background:none;text-align:left}label{display:block}.small{font-size:12px}a{color:var(--blue)}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--surface:#232326;--ink:#f5f5f7;--muted:#aaaab2;--line:#3a3a40;--blue:#58a6ff;--tint:#20344c;--green:#66c58c;--glass:#202023ee}.primary{color:#101014}.primary:hover{background:#8dbfff}}
@media(max-width:760px){aside{position:sticky;top:0;width:auto;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);z-index:2}.brand,.foot{display:none}nav{display:flex;justify-content:space-around}nav button{padding:8px 10px;font-size:13px;gap:6px}main{margin:0;padding:24px 20px}.top{margin-bottom:26px;align-items:flex-start}h1{font-size:30px}.stats{gap:8px}.stats .card{padding:14px}.stat b{font-size:23px}.card{padding:20px}.row{align-items:flex-start}.badge{white-space:nowrap}.card>.row{flex-wrap:wrap}.actions{align-items:stretch;flex-direction:column}.actions button{white-space:nowrap;width:100%}.toolbar .search{max-width:none}.sheet-head,.sheet-body{padding:20px}.demo{white-space:nowrap}.top .status{max-width:140px}nav svg{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<aside><div class="brand">半托管欧区<br>备货用户助手<small>把每次沟通，接续起来。</small></div><nav aria-label="主导航"></nav><div class="foot">本机工作空间<br>消息只读 · 微信人工发送</div></aside><main><div class="top"><span class="demo">交互原型 · 虚构数据</span><button class="quiet small" data-page="data"><span class="status"><i class="dot"></i>近期整理中 · 查看进度</span></button></div><div id="page"></div></main><dialog aria-labelledby="detail-title"><div class="sheet-head row"><div><div class="meta">客户档案</div><h2 id="detail-title"></h2></div><button aria-label="关闭详情" id="close">✕</button></div><div class="sheet-body"><p id="detail-status" role="alert"></p><div id="detail"></div></div></dialog><div class="notice" role="status" aria-live="polite" hidden></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const customers=[{id:1,name:'张先生',remark:'英国小家电 · 张先生',batch:'英国普货 · 11月第一批',stage:'商家决策',reason:'确认补充费用后，是否按计划备货',note:'服务商已说明附加费，商家约定今天反馈。',time:'今天 14:00 前',tab:'due',group:'英国备货对接（示例）'}, {id:2,name:'林女士',remark:'家居用品 · 林女士',batch:'初步沟通',stage:'约定回访',reason:'按约定，了解本月英国备货安排',note:'上次提到月底再聊；目前还没有具体批次。',time:'今天回访',tab:'due',group:'私信'}, {id:3,name:'陈先生',remark:'厨房用品 · 陈先生',batch:'德国普货 · 11月第二批',stage:'归属待确认',reason:'这次发货报告属于哪一批？',note:'同一客户有两批德国货，需要确认一次归属。',time:'1 个关键确认',tab:'review',group:'德国备货协同（示例）'}, {id:4,name:'许女士',remark:'灯具 · 许女士',batch:'法国普货 · 11月第一批',stage:'报价沟通',reason:'等待服务商补充计价说明',note:'已约定明天答复，今天无需重复联系。',time:'明天复查',tab:'waiting',group:'法国头程对接（示例）'}];
const sources=Array.from({length:57},(_,i)=>({id:i,name:i<4?customers[i].group:`欧区工作会话 ${i+1}（示例）`,kind:i%3===0?'私信':'群聊',exempt:i>52}));let page='today',tab='due',scope=false,scopePage=1,query='',selected=null,lastFocus=null,undo=null,timer;
const icons=['<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>','<circle cx="12" cy="8" r="3"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/>','<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M10 10v10"/>','<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>'];
$('nav').innerHTML=['今日','客户','数据','设置'].map((n,i)=>`<button data-page="${['today','customers','data','settings'][i]}"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[i]}</svg>${n}</button>`).join('');
function segments(items,value,key){return `<div class="segments" role="tablist">${items.map(([v,n])=>`<button role="tab" aria-selected="${String(v)===String(value)}" tabindex="${String(v)===String(value)?0:-1}" data-${key}="${v}">${n}</button>`).join('')}</div>`}
function toast(text,fn){clearTimeout(timer);undo=fn;$('.notice').innerHTML=`<span>${esc(text)}</span>${fn?'<button id="undo">撤销</button>':''}`;$('.notice').hidden=false;timer=setTimeout(()=>{$('.notice').hidden=true;undo=null},fn?10000:4000)}
function card(c){return `<article class="card"><div class="row"><div class="person"><div class="avatar">${c.name[0]}</div><div><h3>${c.name}</h3><div class="meta">${c.remark}</div></div></div><span class="badge">${c.time}</span></div><p class="reason">${c.reason}</p><p class="muted">${c.note}</p><div class="actions"><span class="meta">${c.batch} · ${c.stage}</span><button class="primary" data-customer="${c.id}">${c.tab==='review'?'查看并确认':'查看并处理'}</button></div></article>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'));let html='';
if(page==='today'){let list=customers.filter(c=>c.tab===tab);html=`<h1>把今天的跟进，做好。</h1><p class="subtitle">${customers.filter(c=>c.tab==='due').length} 位客户值得联系。每一次建议，都有来由。</p><div class="toolbar">${segments([['due','该联系'],['review','待确认'],['waiting','等待中']],tab,'tab')}<span class="meta">${list.length} 位客户</span></div><div class="cards">${list.map(card).join('')||'<div class="empty"><h2>这一组已经处理好了</h2><p class="muted">新的有效进展会在这里接续。可以去客户档案查看历史。</p></div>'}</div>`}
if(page==='customers'){let list=customers.filter(c=>(c.name+c.remark).includes(query));html=`<h1>客户</h1><p class="subtitle">每位联系人，一份持续更新的档案。</p><div class="toolbar"><input class="search" aria-label="搜索客户" placeholder="搜索备注、昵称" value="${esc(query)}" id="customer-search"><span class="meta">${list.length} 位客户</span></div><div class="list">${list.map(c=>`<div class="row"><div class="person"><span class="avatar">${c.name[0]}</span><div><button class="linkbutton" data-customer="${c.id}">${c.remark}</button><p class="meta">${c.batch} · ${c.stage}</p></div></div><button data-customer="${c.id}">查看档案</button></div>`).join('')||'<div class="empty">没有匹配的客户 <button id="reset-search">清除搜索</button></div>'}</div>`}
if(page==='data'){let list=sources.filter(s=>s.exempt===scope),pages=Math.max(1,Math.ceil(list.length/50));scopePage=Math.min(scopePage,pages);html=`<h1>数据与整理</h1><p class="subtitle">知道数据从哪里来，也知道还有哪里没读完。</p><div class="stats"><div class="card stat"><span class="meta">示例已归档</span><b>20,171</b><span class="small muted">源端可见记录</span></div><div class="card stat"><span class="meta">示例近期覆盖</span><b>68%</b><span class="small muted">近15天优先</span></div><div class="card stat"><span class="meta">示例待识别图片</span><b>42</b><span class="small muted">未计作已理解</span></div></div><div class="card"><div class="row"><h3>近期整理中</h3><span class="meta">示例状态</span></div><div class="progress" aria-label="示例近期进度68%"><i></i></div><p class="muted">已完成的客户先进入工作台；更早历史随后补齐。</p></div><div class="toolbar" style="margin-top:32px"><h2>处理范围</h2>${segments([['false','正常处理'],['true','免跟进']],String(scope),'scope')}</div><p class="meta">会话 · ${list.length} 个 · 每页最多50条 · 原型展示整会话排除</p><div class="list">${list.slice((scopePage-1)*50,scopePage*50).map(s=>`<div class="row"><div><h3>${s.name}</h3><span class="meta">${s.kind} · ${scope?'仅归档':'正常整理'}</span></div><button data-source="${s.id}">${scope?'恢复处理':'免跟进'}</button></div>`).join('')}</div><div class="toolbar" style="margin-top:16px"><button id="prev" ${scopePage===1?'disabled':''}>上一页</button><span class="meta">第 ${scopePage} / ${pages} 页</span><button id="next" ${scopePage===pages?'disabled':''}>下一页</button></div>`}
if(page==='settings')html=`<h1>设置</h1><p class="subtitle">连接与偏好，都在这里。原型不会保存真实配置。</p><div class="cards"><section class="card"><h2>连接状态</h2><div class="list"><div class="row"><span>本机工作台</span><span class="status"><i class="dot"></i>示例：运行中</span></div><div class="row"><span>wx-cli</span><span class="muted">原型未连接</span></div><div class="row"><span>DeepSeek</span><span class="muted">原型不调用模型</span></div></div></section><section class="card"><h2>外观与动态效果</h2><p class="muted">跟随系统浅色／深色，以及“减少动态效果”偏好。</p></section><section class="card"><h2>重建进度</h2><p>当前：M0 · 来源与交互底座</p><p class="muted">实际来源检查请运行 wechat-agent rebuild inspect。新客户引擎尚未接入，此原型不清空旧数据。</p></section></div>`;
$('#page').innerHTML=html;$('#page').classList.remove('page-enter');void $('#page').offsetWidth;$('#page').classList.add('page-enter')}
function detail(id){$('#detail-status').textContent='';selected=customers.find(c=>c.id===id);const c=selected;lastFocus=document.activeElement;$('#detail-title').textContent=c.name;$('#detail').innerHTML=`<section class="section"><h3>在微信找到他</h3><p>${c.remark}</p><p class="meta">来源：${c.group} · 示例 11月8日 10:30</p><button id="copy">复制定位信息</button><span id="copy-status" role="status"></span></section><section class="section"><span class="badge">${c.stage}</span><h2 style="margin-top:12px">${c.reason}</h2><p class="muted">${c.note}</p><details><summary>查看判断依据</summary><div class="evidence"><p class="meta">示例商家 · 昨天 16:30</p><p>${c.tab==='review'?'这批今天已经发出了。':'明天我再确认一下，下午两点前给你答复。'}</p></div><div class="evidence"><p class="meta">来源说明</p><p>原型中的人物、记录、群名均为虚构。</p></div></details>${c.tab==='review'?'<label for="batch">这次发货属于</label><select id="batch"><option value="">请选择已确认的归属</option><option>德国第一批</option><option>德国第二批</option></select><button id="resolve" class="primary">保存判断</button>':`<div class="chips"><button id="done" class="primary">标记这件事已处理</button><button id="postpone">改期</button></div><div id="date-form" hidden><label for="due">下次处理日期</label><input id="due" type="date"><button id="save-date">保存日期</button></div>`}</section><section class="section"><h3>初步沟通</h3><p class="muted">关注英国线路成本，希望费用说明清楚。已有资料不要求重复补填。</p></section><section class="section"><h3>备货批次</h3><p>${c.batch==='初步沟通'?'尚无具体备货需求':c.batch}</p><p class="meta">${c.batch==='初步沟通'?'有实际意向后再建立批次。':c.stage+' · 相关沟通归在同一批次下'}</p></section>`;if(!$('dialog').open)$('dialog').showModal()}
function close(){ $('dialog').close();if(lastFocus?.isConnected)lastFocus.focus();else $('nav button[aria-current=page]').focus()}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();window.scrollTo(0,0)}if(b.dataset.tab){tab=b.dataset.tab;render();$(`[data-tab="${tab}"]`).focus()}if(b.dataset.scope){scope=b.dataset.scope==='true';scopePage=1;render();$(`[data-scope="${scope}"]`).focus()}if(b.dataset.customer)detail(Number(b.dataset.customer));if(b.id==='close')close();if(b.id==='undo'&&undo){const f=undo;undo=null;f();toast('已撤销本次操作')}if(b.dataset.source){const s=sources.find(s=>s.id===Number(b.dataset.source)),old=s.exempt;s.exempt=!old;render();toast(s.exempt?'已移入免跟进':'已恢复正常处理',()=>{s.exempt=old;render()})}if(b.id==='next'||b.id==='prev'){scopePage+=b.id==='next'?1:-1;render()}if(b.id==='reset-search'){query='';render();$('#customer-search').focus()}if(b.id==='copy'){try{await navigator.clipboard.writeText(selected.remark+' · '+selected.group);$('#copy-status').textContent=' 已复制'}catch{$('#copy-status').textContent=' 复制不可用，请手动选择上方文字'}}if(b.id==='postpone'){$('#date-form').hidden=false;$('#due').focus()}if(['done','resolve','save-date'].includes(b.id)){if(b.id==='resolve'&&!$('#batch').value){$('#detail-status').textContent='请先选择归属批次';return}if(b.id==='save-date'&&!$('#due').value){$('#detail-status').textContent='请选择日期';return}const c=selected,old={...c};if(b.id==='resolve'){c.stage='已报告发货';c.tab='done'}else if(b.id==='save-date'){c.time=$('#due').value;c.tab='waiting'}else c.tab='done';close();render();$('nav button[aria-current=page]').focus();toast('已更新示例客户档案',()=>{Object.assign(c,old);render()})}});
document.addEventListener('input',e=>{if(e.target.id==='customer-search'){query=e.target.value;const pos=e.target.selectionStart;render();$('#customer-search').focus();$('#customer-search').setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const bs=[...e.target.parentElement.children],i=bs.indexOf(e.target);bs[e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length].click()}});$('dialog').addEventListener('cancel',e=>{e.preventDefault();close()});render();
</script></html>
